<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encodage Comptoir (essai)</title>
<meta name="theme-color" content="#f2b705">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{{padding-top:env(safe-area-inset-top,0px)}}
body{{margin:0}}
[hidden]{{display:none!important}}
img{{max-width:100%}}
/* Layout: one column phone shell, one question per screen, big action bar fixed at the bottom */
:root{
  --bg:#f3f2ee; --surface:#ffffff; --ink:#1d2328; --muted:#5d656c; --line:#d9d7d0;
  --accent:#f2b705; --accent-ink:#1d2328; --ok:#2f7d4a; --ok-bg:#e3f1e7; --warn-bg:#fff4cc;
  --display:"Archivo", "Arial Black", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15191c; --surface:#1f2428; --ink:#eef0f1; --muted:#a3abb2; --line:#343b41;
  --accent:#f5c22b; --accent-ink:#15191c; --ok:#6fcf8e; --ok-bg:#1d3326; --warn-bg:#3a3214; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191c; --surface:#1f2428; --ink:#eef0f1; --muted:#a3abb2; --line:#343b41;
  --accent:#f5c22b; --accent-ink:#15191c; --ok:#6fcf8e; --ok-bg:#1d3326; --warn-bg:#3a3214; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.4}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 140px}
h1,h2{font-family:var(--display);font-weight:800;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:28px} h2{font-size:26px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.steps{display:flex;gap:6px;margin:4px 0 18px}
.steps i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.hint{color:var(--muted);margin:8px 0 18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border-radius:14px;
  border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:21px;padding:12px 18px}
.big.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.big:disabled{opacity:.4;cursor:default}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:520px;margin:0 auto;display:flex;gap:10px}
.bar .back{flex:0 0 96px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line);max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .x{position:absolute;top:4px;right:4px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);font-weight:700;font-size:20px}
.camera{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%;min-height:200px;border-radius:16px;
  border:3px dashed var(--line);background:var(--surface);font-family:var(--display);font-weight:800;font-size:22px}
.camera svg{width:56px;height:56px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:84px;border-radius:12px;border:2px solid var(--line);
  background:var(--surface);padding:12px 14px;text-align:left}
.tile b{font-family:var(--display);font-size:13px;letter-spacing:.1em;color:var(--muted)}
.tile span{font-weight:700;font-size:19px;line-height:1.15}
.tile.sel{border-color:var(--ink);background:var(--accent);color:var(--accent-ink)}
.tile.sel b{color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.chip{min-height:48px;padding:8px 16px;border-radius:24px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:17px}
.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.zone{border-left:10px solid var(--zc)}.chip.zone.sel{background:var(--zc);border-color:var(--zc);color:#fff}
label.f{display:block;font-weight:700;margin:14px 0 6px}
input.t,textarea.t{width:100%;box-sizing:border-box;min-height:58px;border-radius:12px;border:2px solid var(--line);background:var(--surface);
  color:var(--ink);font:inherit;font-size:20px;padding:10px 14px}
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dims input{text-align:center;font-variant-numeric:tabular-nums}
.dims small{display:block;text-align:center;color:var(--muted);font-size:14px;margin-top:4px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:58px;height:58px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:28px;font-weight:700}
.qty input{flex:1;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.recap dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.recap dt{color:var(--muted)} .recap dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.code{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.08em;background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:6px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.item{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:10px}
.thumb{width:72px;height:72px;border-radius:10px;background:var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:800;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.item .n{font-weight:700;font-size:19px} .item .d{color:var(--muted);font-size:15px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--warn-bg)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.sec{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 0}
pre.txt{white-space:pre-wrap;font-family:var(--body);font-size:16px;background:var(--bg);border-radius:10px;padding:12px;margin:12px 0 0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:12px 20px;border-radius:24px;font-weight:700}
.ex{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:1px 6px;margin-left:6px}
@media (prefers-reduced-motion:no-preference){.tile,.chip,.big{transition:transform .08s}.tile:active,.chip:active,.big:active{transform:scale(.97)}}
/* Protocole photo : une carte par photo demandée */
.slot{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);
  border-radius:14px;padding:10px;margin-bottom:10px;text-align:left;width:100%;box-sizing:border-box}
.slot.req{border-color:var(--ink)}
.slot .pic{width:96px;height:96px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted)}
.slot .pic img{width:100%;height:100%;object-fit:cover}
.slot .pic svg{width:58px;height:58px}
.slot h3{font-family:var(--display);font-weight:800;font-size:19px;margin:0 0 2px}
.slot p{margin:0;color:var(--muted);font-size:15px;line-height:1.3}
.slot .act{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.slot .act button{min-height:44px;padding:6px 14px;border-radius:22px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:16px}
.slot .act button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.warn{background:var(--warn-bg);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:15px;font-weight:700}
.tips{margin:6px 0 14px;color:var(--muted);font-size:15px}
.tips summary{font-weight:700;cursor:pointer;min-height:40px;display:flex;align-items:center}
.tips ul{margin:4px 0 0;padding-left:20px}
.ia{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:9px;background:var(--ok-bg);color:var(--ok);vertical-align:middle;margin-left:6px}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px;margin:0 0 12px}
.wait progress{flex:1;height:8px}
.big.vif{background:#ffd800;color:#1d2328}
.revoir{width:100%;max-height:62vh;object-fit:contain;border-radius:14px;background:#000;margin-top:12px;display:block}
.chips.gros .chip{min-height:60px;font-size:19px;padding:10px 20px}
.sub{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
</style>

</head>
<body>
<div class="app" id="app"></div>
<div class="bar" id="bar"><div class="in" id="barIn"></div></div>
<input type="file" id="cam" accept="image/*" capture="environment" multiple hidden>
<div class="toast" id="toast" hidden></div>
<script src="poids.js"></script>
<script>
"use strict";
const VERSION="7.0 (Saïd / Audrey)";
// ---------- Données de référence ----------
// Préfixes et catégories : les noms doivent être identiques aux catégories du back-office Impulsion (vérifiés le 14/10/2026).
const CATS=[
 ["SA","Sanitaire"],["PA","Sanitaire","Paroi de douche"],["CH","Chassis","Châssis"],["PO","Portes"],["CAR","Carrelage"],["GRO","Gros œuvre"],
 ["RA","Chauffage"],["ELEC","Electricité","Électricité"],["LUM","Electricité","Luminaires"],["BOI","Bois"],["PAR","Parquet & bardage"],["LAM","LAMBRIS/ Plafond","Lambris / Plafond"],["TOI","Toiture"],
 ["ISO","Isolant"],["Q","Quincaillerie"],["OUT","Outillage"],["ELECTRO","Électro","Électroménager"],["DIV","Divers"]];
// [préfixe, catégorie du site, libellé affiché sur le bouton (si différent)]
const label=c=>{const x=CATS.find(x=>x[0]===c);return x?(x[2]||x[1]):""};
const siteCat=c=>{const x=CATS.find(x=>x[0]===c);return x?x[1]:""};
// Derniers numéros relevés dans l'export Impulsion du 14/10/2026 (modifiables dans Réglages).
const LAST0={SA:138,PA:30,CH:110,PO:59,CAR:68,GRO:40,RA:49,ELEC:12,LUM:23,BOI:10,PAR:19,LAM:1,ELECTRO:1,TOI:8,ISO:6,Q:14,OUT:11,DIV:34};
const SUGG={SA:["Évier","Lavabo","Vasque","WC","Baignoire","Bac de douche","Robinet","Meuble lavabo"],PA:["Paroi de douche","Porte de douche"],
 CH:["Châssis PVC","Châssis bois","Châssis alu","Porte-fenêtre","Velux"],PO:["Porte intérieure","Porte chêne","Porte extérieure","Porte vitrée","Bloc-porte"],
 CAR:["Carrelage sol","Faïence murale","Plinthes","Dalles"],GRO:["Briques","Blocs béton","Pavés","Poutrains","Linteau"],
 RA:["Radiateur","Radiateur électrique","Thermostat","Vannes"],ELEC:["Prises","Interrupteurs","Variateur","Disjoncteurs","Câble"],
 LUM:["Spot LED","Plafonnier","Applique","Réglette"],BOI:["Planches","Poutre","Panneau OSB","Panneau multiplex","Trespa"],
 PAR:["Parquet","Bardage","Lames de terrasse"],LAM:["Lambris bois","Lambris PVC","Dalles de plafond"],ELECTRO:["Frigo","Four","Taque de cuisson","Hotte","Lave-vaisselle","Lave-linge"],TOI:["Tuiles","Ardoises","Gouttière","Tôles"],
 ISO:["Laine de verre","Laine de roche","Panneau PIR","Polystyrène"],Q:["Poignées","Charnières","Serrures","Vis"],
 OUT:["Scie","Outil électrique","Compresseur","Établi","Outil à main","Échelle"],DIV:["Mobilier","Palette","Vitre","Lot divers"]};
// Valeurs alignées sur les filtres du moteur « Faire avec ».
const ETATS=["Neuf","Très bon état","Bon état","À rafraîchir","Pour pièces"];
// D'où vient le matériau : déposé par un particulier, collecté par l'équipe, ou récupéré via Intradel.
const PROVENANCES=["Dépôt","Collecte","Intradel"];
// Poids et emplacement dans l'entrepôt : mis de côté pour l'instant (demande de Jérôme, 23/10). Passer à true pour les remettre.
const POIDS_EMPL=false;
const UNITS=["pièce","m²","m courant","lot"];
const MATIERES=["Bois massif","Panneau (multiplex, OSB, MDF)","Métal","Verre","Céramique","Pierre / béton","PVC / plastique","Textile"];
const COULEURS=["Blanc","Noir","Gris / métal","Naturel","Brun","Beige","Couleur"];
const LIEUX=["Intérieur","Extérieur","Les deux"];
// Emplacement dans l'entrepôt : zone + travée + niveau (B3-1), « R » = réception, pas encore rangé.
// Nombre de travées par zone d'après le plan provisoire, à ajuster avec les vraies mesures.
const ZONES={A:["Gros œuvre, bois",4],B:["Sanitaire, isolant, toiture",4],C:["Vitrine",2],D:["Portes",12],E:["Châssis, radiateurs",12],F:["Petit matériel",3]};
const ZONE_COUL={R:"#7b8480",A:"#a8642c",B:"#2c68a8",C:"#23857c",D:"#b83c33",E:"#7552a3",F:"#3f8a35"};
const ZONE_CAT={GRO:"A",CAR:"A",BOI:"A",PAR:"A",LAM:"A",SA:"B",ISO:"B",TOI:"B",ELECTRO:"C",DIV:"C",PO:"D",CH:"E",PA:"E",RA:"E",Q:"F",ELEC:"F",LUM:"F",OUT:"F"};
const emplParts=e=>{const m=/^([A-F])(\d+)?(?:-(\d))?$/.exec(e||"");return m?{z:m[1],t:m[2]||"",n:m[3]??""}:{z:e==="R"?"R":"",t:"",n:""}};
// Ce que le nom dit déjà de la matière (la photo départage), du lieu et de la forme.
const MAT_NOM={"Lavabo":["Céramique"],"Vasque":["Céramique","Verre","Pierre / béton"],"WC":["Céramique"],"Baignoire":["Céramique","PVC / plastique","Métal"],
 "Bac de douche":["Céramique","PVC / plastique"],"Évier":["Métal","Céramique","Pierre / béton"],"Robinet":["Métal"],"Meuble lavabo":["Panneau (multiplex, OSB, MDF)","Bois massif"],
 "Paroi de douche":["Verre"],"Porte de douche":["Verre"],"Châssis PVC":["PVC / plastique"],"Châssis bois":["Bois massif"],"Châssis alu":["Métal"],
 "Porte-fenêtre":["PVC / plastique","Bois massif","Métal"],"Velux":["Bois massif","PVC / plastique"],"Porte intérieure":["Bois massif","Panneau (multiplex, OSB, MDF)"],
 "Porte chêne":["Bois massif"],"Porte extérieure":["Bois massif","PVC / plastique","Métal"],"Porte vitrée":["Bois massif","Verre","Métal"],"Bloc-porte":["Bois massif","Panneau (multiplex, OSB, MDF)"],
 "Carrelage sol":["Céramique","Pierre / béton"],"Faïence murale":["Céramique"],"Plinthes":["Céramique","Bois massif","Panneau (multiplex, OSB, MDF)"],"Dalles":["Céramique","Pierre / béton"],
 "Briques":["Pierre / béton"],"Blocs béton":["Pierre / béton"],"Pavés":["Pierre / béton"],"Poutrains":["Pierre / béton"],"Linteau":["Pierre / béton","Métal","Bois massif"],
 "Radiateur":["Métal"],"Vannes":["Métal"],"Prises":["PVC / plastique"],"Interrupteurs":["PVC / plastique"],"Disjoncteurs":["PVC / plastique"],
 "Planches":["Bois massif"],"Poutre":["Bois massif"],"Panneau OSB":["Panneau (multiplex, OSB, MDF)"],"Panneau multiplex":["Panneau (multiplex, OSB, MDF)"],
 "Parquet":["Bois massif","Panneau (multiplex, OSB, MDF)"],"Bardage":["Bois massif","PVC / plastique","Métal"],"Lames de terrasse":["Bois massif","PVC / plastique"],
 "Lambris bois":["Bois massif"],"Lambris PVC":["PVC / plastique"],"Tuiles":["Céramique","Pierre / béton"],"Ardoises":["Pierre / béton"],"Gouttière":["Métal","PVC / plastique"],"Tôles":["Métal"],
 "Panneau PIR":["PVC / plastique"],"Polystyrène":["PVC / plastique"],"Poignées":["Métal"],"Charnières":["Métal"],"Serrures":["Métal"],"Vis":["Métal"],
 "Frigo":["Métal"],"Four":["Métal"],"Hotte":["Métal"],"Lave-vaisselle":["Métal"],"Lave-linge":["Métal"],"Palette":["Bois massif"],"Vitre":["Verre"]};
const EXT=["Porte extérieure","Tuiles","Ardoises","Gouttière","Tôles","Pavés","Lames de terrasse","Bardage","Briques","Blocs béton","Poutrains","Châssis PVC","Châssis bois","Châssis alu","Porte-fenêtre","Velux","Palette"];
const DEUX=["Planches","Poutre","Panneau OSB","Panneau multiplex","Trespa","Linteau","Outil électrique","Scie","Compresseur","Établi","Outil à main","Échelle","Charnières","Vis","Câble","Robinet"];
const lieuNom=(cat,nom)=>EXT.includes(nom)||cat==="TOI"?"Extérieur":DEUX.includes(nom)||["OUT","Q","GRO","BOI"].includes(cat)?"Les deux":nom?"Intérieur":"";
const FORMES={"Plaque":["Panneau OSB","Panneau multiplex","Trespa","Carrelage sol","Faïence murale","Dalles","Dalles de plafond","Tôles","Vitre","Panneau PIR","Polystyrène","Ardoises","Tuiles"],
 "Barre / poutre":["Planches","Poutre","Linteau","Poutrains","Lames de terrasse","Bardage","Parquet","Lambris bois","Lambris PVC","Plinthes","Gouttière"],
 "Rouleau":["Laine de verre","Laine de roche","Câble"],"Petite pièce":["Vis","Charnières","Poignées","Serrures","Prises","Interrupteurs","Vannes","Spot LED","Disjoncteurs","Robinet","Thermostat","Variateur"]};
const formeNom=(cat,nom)=>{for(const k in FORMES)if(FORMES[k].includes(nom))return k;return ["CAR","TOI"].includes(cat)?"Plaque":["BOI","PAR","LAM"].includes(cat)?"Barre / poutre":nom?"Objet fini":""};
// Estimation grossière d'après les mesures (cm) : ce que le client doit prévoir pour l'emporter.
function transport(f){const d=[f.L,f.l,f.h].map(x=>parseFloat(String(x).replace(",","."))||0).sort((a,b)=>b-a);if(!d[0])return "";
 return d[0]<=120&&d[1]<=80?"Voiture":d[0]<=250&&d[1]<=150?"Camionnette":"À plusieurs"}

// ---------- Stockage (IndexedDB, sur le téléphone) ----------
let idb;
function openDb(){return new Promise((ok,ko)=>{// La version d'essai garde ses fiches à part, pour ne pas mélanger avec les vraies.
const r=indexedDB.open(location.pathname.includes("/essai/")?"comptoir-essai":"comptoir",1);
 r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("fiches",{keyPath:"id"});d.createObjectStore("reglages")};
 r.onsuccess=()=>{idb=r.result;ok()};r.onerror=()=>ko(r.error)})}
function tx(store,mode,fn){return new Promise((ok,ko)=>{const t=idb.transaction(store,mode),s=t.objectStore(store);const res=fn(s);
 t.oncomplete=()=>ok(res&&res.result);t.onerror=()=>ko(t.error)})}
const dbAll=()=>tx("fiches","readonly",s=>s.getAll());
const dbPut=f=>tx("fiches","readwrite",s=>s.put(f));
const dbDel=id=>tx("fiches","readwrite",s=>s.delete(id));
const getSet=k=>tx("reglages","readonly",s=>s.get(k));
const putSet=(k,v)=>tx("reglages","readwrite",s=>s.put(v,k));

let fiches=[], LAST={...LAST0};
async function load(){fiches=(await dbAll()).sort((a,b)=>b.cree-a.cree);const l=await getSet("last");if(l)LAST={...LAST0,...l};recoOn=(await getSet("reco"))!==false}

// ---------- Outils ----------
let screen="home", cur=null, step=0, openId=null;
// Qui encode : demandé à chaque ouverture. Saïd a un parcours simplifié, Audrey l'app complète.
let qui=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function nextCode(cat){let n=LAST[cat]||0;fiches.forEach(f=>{if(f.cat===cat&&f.id!==cur?.id){const m=+f.code.slice(cat.length);if(m>n)n=m}});return cat+(n+1)}
function dimTxt(f){const d=[f.L,f.l,f.h].filter(Boolean);return d.length?d.join(" × ")+" cm":""}
// L1 ≥ L2 ≥ L3 : les mesures sont toujours rangées de la plus grande à la plus petite (cm)
function trierDims(f){const v=[f.L,f.l,f.h].map(x=>String(x??"").trim()).filter(Boolean).sort((a,b)=>(parseFloat(b.replace(",","."))||0)-(parseFloat(a.replace(",","."))||0));[f.L,f.l,f.h]=[v[0]||"",v[1]||"",v[2]||""]}
function descr(f){return [f.etat,dimTxt(f)?"Dimensions : "+dimTxt(f):"",f.matiere?"Matière : "+f.matiere:"",f.couleur?"Couleur : "+f.couleur:"",
 f.lieu==="Les deux"?"Intérieur ou extérieur":f.lieu,"Vendu par "+f.unite,f.note].filter(Boolean).join(" · ")}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}

// Fichier d'import Impulsion : séparateur « ; », encodage Windows-1252 comme leur export.
// Image : nom de la première photo ; Impulsion la demande à l'étape « Importer les images associées ».
const HEAD=["Référence","Nom","Catégories","Stock","Prix de vente TTC","Description","Image"];
function csvText(list){const q=v=>{v=String(v??"");return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 return [HEAD].concat(list.map(f=>[f.code,f.nom,siteCat(f.cat),f.qte,String(f.prix||"").replace(".",","),descr(f),f.photos.length?photoName(f,0):""])).map(r=>r.map(q).join(";")).join("\r\n")+"\r\n"}
// Fichier des caractéristiques pour l'outil « Faire avec » (onglet Fiches) : UTF-8, séparateur « ; ».
const HEAD_FICHES=["Référence","Nom","Catégorie","L1 (cm)","L2 (cm)","L3 (cm)","Matière","Couleur","Intérieur / extérieur","État","Forme","Transport","Quantité","Unité","Arrivée","Photos"].concat(POIDS_EMPL?["Emplacement","Poids (kg)","Poids estimé"]:[],["Provenance"]);
function fichesCsv(list){const q=v=>{v=String(v??"");return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 return "﻿"+[HEAD_FICHES].concat(list.map(f=>[f.code,f.nom,siteCat(f.cat),f.L,f.l,f.h,f.matiere,f.couleur,f.lieu,f.etat,formeNom(f.cat,f.nom),transport(f),f.qte,f.unite,
  new Date(f.cree).toISOString().slice(0,10),f.photos.map((_,i)=>photoName(f,i)).join(" ")].concat(POIDS_EMPL?[f.empl||"",f.poids||"",f.poids&&f.poidsEst?"oui":""]:[],[f.prov||""]))).map(r=>r.map(q).join(";")).join("\r\n")+"\r\n"}
// Tableau des annonces existantes vérifiées au comptoir (rien n'est importé automatiquement).
const HEAD_MAJ=["Référence","Statut","Titre actuel","Titre proposé","Catégorie","Stock compté","Description proposée","Photos"].concat(POIDS_EMPL?["Emplacement"]:[]);
// Titre pour le site : le titre nettoyé (ou le nom), avec les mesures si le titre n'en a pas.
function titrePropose(f){const d=[f.L,f.l,f.h].filter(Boolean),t=f.titreBase||f.nom;return t+(d.length&&!/\d/.test(t)?" – "+d.join(" × ")+" cm":"")}
function majCsv(list){const q=v=>{v=String(v??"");return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 return [HEAD_MAJ].concat(list.map(f=>f.statut==="introuvable"?[f.code,"Introuvable ou vendu",f.titreActuel,"","","0","","",""]:
  [f.code,f.codeNouveau?"Nouvelle référence (écrite sur l'objet)":"Vérifiée",f.titreActuel,titrePropose(f),siteCat(f.cat),f.qte,descr(f),f.photos.map((_,i)=>photoName(f,i)).join(" ")].concat(POIDS_EMPL?[f.empl||""]:[]))).map(r=>r.map(q).join(";")).join("\r\n")+"\r\n"}
const CP={0x20AC:0x80,0x201A:0x82,0x192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x2C6:0x88,0x2030:0x89,0x160:0x8A,0x2039:0x8B,0x152:0x8C,0x17D:0x8E,
 0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x2DC:0x98,0x2122:0x99,0x161:0x9A,0x203A:0x9B,0x153:0x9C,0x17E:0x9E,0x178:0x9F};
function cp1252(s){const out=new Uint8Array(s.length);let n=0;for(const ch of s){const c=ch.codePointAt(0);
 out[n++]=c<0x80||(c>=0xA0&&c<=0xFF)?c:(CP[c]??0x3F)}return out.slice(0,n)}
function dataUrlToBlob(u){const [h,b]=u.split(",");const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.slice(5,h.indexOf(";"))})}

function b64(bytes){let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s)}

const TIPS=`<details class="tips"><summary>Conseils pour une bonne photo</summary><ul><li>Lumière du jour, pas de contre-jour (pas de fenêtre derrière l'objet).</li>
 <li>Un seul objet dans la photo, rien qui dépasse devant.</li><li>Grand objet : téléphone à l'horizontale, reculez.</li><li>Essuyez l'objectif avec un chiffon.</li></ul></details>`;
// Contrôle d'une photo : trop sombre, trop claire, floue (variance du laplacien sur une image grise de 320 px, seuils calés sur des photos test).
function qualite(img){const k=320/Math.max(img.width,img.height),w=Math.max(3,Math.round(img.width*k)),h=Math.max(3,Math.round(img.height*k));
 const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0,w,h);
 const d=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h);let m=0;for(let i=0;i<w*h;i++){g[i]=.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2];m+=g[i]}m/=w*h;
 let s=0,s2=0,n=0;for(let y=1;y<h-1;y++)for(let x0=1;x0<w-1;x0++){const i=y*w+x0,v=g[i-1]+g[i+1]+g[i-w]+g[i+w]-4*g[i];s+=v;s2+=v*v;n++}
 const net=s2/n-(s/n)**2;return m<55?"Trop sombre : allumez ou approchez-vous d'une fenêtre, puis reprenez la photo.":m>225?"Trop claire : évitez le soleil direct ou le flash, puis reprenez la photo.":net<60?"Floue : tenez le téléphone immobile, touchez l'objet à l'écran pour faire la mise au point, puis reprenez.":""}

// ---------- Reconnaissance d'après la photo (sur le téléphone, sans internet une fois chargée) ----------
// Modèle MobileCLIP S0 (Apple) : la photo est comparée à des descriptions précalculées (modeles/libelles.json).
const RECO={etat:"",pct:0,ses:null,cls:null,err:""};
let recoOn=true;
async function recoCharger(){
 if(RECO.etat==="pret"||RECO.etat==="charge")return RECO.wait;
 RECO.etat="charge";RECO.pct=0;
 return RECO.wait=(async()=>{try{
  if(!window.ort)await new Promise((ok,ko)=>{const s=document.createElement("script");s.src="vendor/ort.wasm.min.js";s.onload=ok;s.onerror=()=>ko(new Error("ort"));document.head.appendChild(s)});
  ort.env.wasm.numThreads=1;ort.env.wasm.wasmPaths=new URL("vendor/",location.href).href;
  const lib=await (await fetch("modeles/libelles.json")).json();
  RECO.cls=lib.classes.map(c=>{const b=atob(c.e),v=new Float32Array(b.length);let n=0;for(let i=0;i<b.length;i++){const q=b.charCodeAt(i);v[i]=(q>127?q-256:q)*c.k;n+=v[i]*v[i]}n=Math.sqrt(n);for(let i=0;i<v.length;i++)v[i]/=n;return{...c,vec:v}});
  const r=await fetch("modeles/mobileclip_s0.onnx"),tot=+r.headers.get("content-length")||23e6,rd=r.body.getReader(),parts=[];let got=0;
  for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;const p=Math.min(99,Math.round(got/tot*100));if(p!==RECO.pct){RECO.pct=p;recoMaj()}}
  const buf=new Uint8Array(got);let o=0;for(const p of parts){buf.set(p,o);o+=p.length}
  RECO.ses=await ort.InferenceSession.create(buf,{executionProviders:["wasm"]});RECO.etat="pret";recoMaj();
 }catch(e){RECO.etat="erreur";RECO.err=String(e&&e.message||e);recoMaj()}})()}
// Met à jour l'écran ouvert quand le chargement ou l'analyse avancent.
const recoTxt=()=>RECO.etat==="pret"?"Prête":RECO.etat==="charge"?"Téléchargement : "+RECO.pct+" %":RECO.etat==="erreur"?"Problème : "+esc(RECO.err):"Pas encore chargée sur ce téléphone";
function recoMaj(){if(screen==="reglages"){const e=$("#recoEtat");if(e)e.innerHTML=recoTxt();return}if((screen==="wiz"&&step<=1)||(screen==="wizs"&&(step===0||step===2))){const w=$("#recoWait");if(RECO.etat==="charge"){if(w)w.querySelector("progress").value=RECO.pct;return}render()}}
async function vecteur(src){const img=await chargerImg(src),c=document.createElement("canvas");c.width=c.height=256;
 const k=256/Math.min(img.width,img.height),w=img.width*k,h=img.height*k,x=c.getContext("2d",{willReadFrequently:true});
 x.imageSmoothingQuality="high";x.drawImage(img,(256-w)/2,(256-h)/2,w,h);const d=x.getImageData(0,0,256,256).data,t=new Float32Array(3*256*256);
 for(let i=0;i<256*256;i++){t[i]=d[4*i]/255;t[65536+i]=d[4*i+1]/255;t[131072+i]=d[4*i+2]/255}
 const out=await RECO.ses.run({pixel_values:new ort.Tensor("float32",t,[1,3,256,256])}),v=out.image_embeds.data;let n=0;for(const a of v)n+=a*a;n=Math.sqrt(n);return Array.from(v,a=>a/n)}
// Probabilités (softmax, échelle 100 comme CLIP) de chaque description d'un groupe : nom, matière ou couleur.
function probas(v,g){const L=RECO.cls.filter(c=>c.g===g),s=L.map(c=>{let d=0;for(let i=0;i<v.length;i++)d+=v[i]*c.vec[i];return 100*d}),m=Math.max(...s),e=s.map(x=>Math.exp(x-m)),t=e.reduce((a,b)=>a+b,0);
 return L.map((c,i)=>({v:c.v,c:c.c,p:e[i]/t}))}
async function analyser(f){
 if(!f.slots[0]||!recoOn)return;
 const cle=f.slots[0].length+":"+(f.slots[1]||"").length;if(f.reco&&f.reco.cle===cle)return;
 recoCharger();await RECO.wait;if(RECO.etat!=="pret")return;
 try{const v0=await vecteur(f.slots[0]),v1=f.slots[1]?await vecteur(f.slots[1]):null,vm=v1?v0.map((a,i)=>(a+v1[i])/2):v0;
  const noms=probas(v0,"nom"),cats={};noms.forEach(o=>cats[o.c]=(cats[o.c]||0)+o.p);
  const map=a=>Object.fromEntries(a.map(o=>[o.v,o.p]));
  f.reco={cle,cats:Object.entries(cats).sort((a,b)=>b[1]-a[1]),noms:Object.fromEntries(noms.map(o=>[o.c+"|"+o.v,o.p])),mat:map(probas(vm,"matiere")),coul:map(probas(vm,"couleur"))};
  if(!f.cat&&f.reco.cats[0][1]>=.5){f.cat=f.reco.cats[0][0];f.propose.cat=1}
 }catch(e){RECO.err=String(e&&e.message||e)}
 if(f===cur)recoMaj()}
function proposerNom(){if(cur.nom||!cur.reco||!cur.cat)return;let best="",p=0;
 for(const k in cur.reco.noms){const [c,v]=k.split("|");if(c===cur.cat&&cur.reco.noms[k]>p){p=cur.reco.noms[k];best=v}}
 if(best){cur.nom=best;cur.propose.nom=1}}
function proposerDetails(){const r=cur.reco,P=cur.propose;if(cur.type==="maj"&&cur.matiere&&cur.couleur&&cur.lieu)return;
 if(!cur.matiere||(P.matiere&&cur.type!=="maj")){const c=MAT_NOM[cur.nom];let v="";
  if(c&&c.length===1)v=c[0];else if(c)v=r?c.slice().sort((a,b)=>(r.mat[b]||0)-(r.mat[a]||0))[0]:c[0];
  else if(r){const [m,p]=Object.entries(r.mat).sort((a,b)=>b[1]-a[1])[0];if(p>=.6)v=m}
  cur.matiere=v;P.matiere=v?1:0}
 if(r&&(!cur.couleur||(P.couleur&&cur.type!=="maj"))){const [c,p]=Object.entries(r.coul).sort((a,b)=>b[1]-a[1])[0];cur.couleur=p>=.45?c:"";P.couleur=cur.couleur?1:0}
 if(!cur.lieu||(P.lieu&&cur.type!=="maj")){cur.lieu=lieuNom(cur.cat,cur.nom);P.lieu=cur.lieu?1:0}}
const ia=k=>cur.propose[k]?`<span class="ia">${cur.type==="maj"?"à vérifier":"proposé"}</span>`:"";

   ${cur.type==="maj"?`<p class="hint" style="margin-top:12px">Titre proposé pour le site : <b>${esc(titrePropose(cur))}</b></p>`:""}
   <p class="hint" style="margin-top:12px">${cur.type==="maj"&&!cur.codeNouveau?"Vérifiez que":"Écrivez"} <b>${esc(cur.code)}</b> ${cur.type==="maj"&&!cur.codeNouveau?"est bien écrit":""} sur le matériau (craie, scotch ou étiquette).</p>
   <label class="f" for="note">Remarque (facultatif)</label><input class="t" id="note" value="${esc(cur.note)}" placeholder="marque, défaut…">

 }

 bar((step>0?`<button class="big ghost back" id="prev">Retour</button>`:"")+`<button class="big" id="next" ${ok?"":"disabled"}>${step===last?"Enregistrer":"Suivant"}</button>`);
 $("#cancel").onclick=()=>{screen=cur.type==="maj"?"annonce":"home";render()};

  cur.photos=cur.slots.filter(Boolean);const f={...cur};delete f.slots;delete f.qual;await dbPut(f);await load();toast("Matériau enregistré : "+cur.code);screen=cur.type==="maj"?"annonces":"home";render()}};

// ---------- Parcours simplifié de Saïd ----------
// Photos (revues une à une), mesures et quantité, catégorie reconnue, nom proposé, état et provenance, puis vérification.
const S_STEPS=["Photos","Mesures","Catégorie","Nom","État","Vérifier"];
const S_SLOTS=[{t:"1. Vue d'ensemble",d:"Tout l'objet, de face, sur un fond dégagé.",i:"ens",req:1},{t:"2. De près",d:"La matière et les défauts.",i:"pres"},{t:"3. Mesure",d:"Le mètre déplié contre l'objet.",i:"mes"}];
const S_ETATS=["Neuf (emballé)","Bon état","Mauvais état"];
// Libellés de Saïd → valeur enregistrée (la même que dans l'app d'Audrey)
const S_PROV=[["Déposé ici","Dépôt"],["Cherché ailleurs","Collecte"],["Vient du container","Intradel"]];
const MAT_EN={"Céramique":"en céramique","Bois massif":"en bois","Métal":"en métal","Verre":"en verre","PVC / plastique":"en PVC"};
// Nom parlant : le nom reconnu, la matière quand elle est sûre, et les mesures. Modifiable ensuite.
function nomParlant(base){const r=cur.reco,c=MAT_NOM[base];let m="";
 if(c&&c.length===1)m=c[0];else if(c&&r)m=c.slice().sort((a,b)=>(r.mat[b]||0)-(r.mat[a]||0))[0];else if(!c&&r){const [x,p]=Object.entries(r.mat).sort((a,b)=>b[1]-a[1])[0];if(p>=.6)m=x}
 const d=[cur.L,cur.l,cur.h].filter(Boolean);return [base,base.toLowerCase().includes((MAT_EN[m]||"").slice(3))?"":MAT_EN[m]].filter(Boolean).join(" ")+(d.length?" – "+d.join(" × ")+" cm":"")}
function wizSaid(a){
 if(!cur.slots){cur.slots=[0,1,2].map(i=>cur.photos[i]||null);cur.propose=cur.propose||{};cur.qual=cur.qual||[]}
 const last=S_STEPS.length-1;
 const head=`<div class="top"><span class="brand">Étape ${step+1} sur ${S_STEPS.length}</span><button class="chip" id="cancel">Annuler</button></div>
  <div class="steps">${S_STEPS.map((_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>`;
 let body="",ok=true,barre=null;
 if(step===0&&cur.revoir!=null&&cur.slots[cur.revoir]){const i=cur.revoir;
  body=`<h2>La photo est bonne ?</h2><img class="revoir" src="${cur.slots[i]}" alt="${esc(S_SLOTS[i].t)}">${cur.qual[i]?`<div class="warn">${cur.qual[i]}</div>`:""}`;
  barre=`<button class="big ghost" id="reprendre" style="flex:1">Reprendre</button><button class="big vif" id="valide" style="flex:1;font-size:40px" aria-label="Valider la photo">✓</button>`;
 } else if(step===0){
  const card=(s,i)=>{const p=cur.slots[i];return `<div class="slot ${s.req&&!p?"req":""}">${p?`<button class="pic" data-voir="${i}" style="border:0;padding:0"><img src="${p}" alt="${esc(s.t)}"></button>`:`<div class="pic">${ICO[s.i]}</div>`}
   <div><h3>${s.t}</h3><p>${s.d}</p>
   <div class="act">${p?`<button data-voir="${i}">Revoir</button><button data-shot="${i}">Reprendre</button>`:`<button class="go" data-shot="${i}" style="background:#ffd800;border-color:#ffd800">Prendre la photo</button>`}</div></div></div>`};
  body=`<h2>Trois photos</h2><p class="hint">La première suffit pour continuer.</p>${S_SLOTS.map(card).join("")}`;
  ok=!!cur.slots[0];
 } else if(step===1){
  body=`<h2>Mesures et quantité</h2><p class="hint">En centimètres. Laissez vide ce qui ne se mesure pas.</p>
   <div class="dims"><div><input class="t" id="L" inputmode="decimal" value="${esc(cur.L)}" aria-label="L1, la plus grande"><small>L1 (plus grande)</small></div>
   <div><input class="t" id="l" inputmode="decimal" value="${esc(cur.l)}" aria-label="L2"><small>L2</small></div>
   <div><input class="t" id="h" inputmode="decimal" value="${esc(cur.h)}" aria-label="L3, la plus petite"><small>L3 (plus petite)</small></div></div>
   <label class="f" for="qte">Combien ?</label>
   <div class="qty"><button id="minus" aria-label="Moins">−</button><input class="t" id="qte" inputmode="numeric" value="${esc(cur.qte)}"><button id="plus" aria-label="Plus">+</button></div>
   <label class="f">Unité</label><div class="chips gros">${UNITS.map(u=>`<button class="chip ${cur.unite===u?"sel":""}" data-unit="${u}">${u}</button>`).join("")}</div>`;
 } else if(step===2){
  const r=cur.reco,tile=c=>`<button class="tile ${cur.cat===c?"sel":""}" data-cat="${c}"><b>${c}</b><span>${esc(label(c))}</span></button>`;
  const wait=!r&&RECO.etat==="charge"?`<div class="wait" id="recoWait">Préparation de la reconnaissance (une seule fois)… <progress max="100" value="${RECO.pct}"></progress></div>`:!r&&RECO.etat==="pret"?`<div class="wait">Analyse de la photo…</div>`:"";
  const top=r?r.cats.filter(x=>x[1]>=.08).slice(0,3).map(x=>x[0]):[];
  body=`<h2>C'est quoi comme matériau ?</h2><p class="hint">Touchez la bonne case.</p>${wait}
   ${top.length?`<p class="sub">D'après la photo</p><div class="tiles">${top.map(tile).join("")}</div><p class="sub">Toutes les catégories</p>`:""}
   <div class="tiles">${CATS.filter(([c])=>!top.includes(c)).map(([c])=>tile(c)).join("")}</div>`;
  ok=!!cur.cat;
 } else if(step===3){
  if(!cur.nom&&cur.reco){let best="",p=0;for(const k in cur.reco.noms){const [c,v]=k.split("|");if(c===cur.cat&&cur.reco.noms[k]>p){p=cur.reco.noms[k];best=v}}if(best)cur.nom=nomParlant(best)}
  body=`<h2>Le nom</h2><p class="hint">${cur.nom?"Proposé d'après la photo et les mesures. Vous pouvez le changer.":"Touchez un nom, ou écrivez-le."}</p>
   <textarea class="t" id="nom" rows="2" style="resize:none" placeholder="ex. Lavabo en céramique">${esc(cur.nom)}</textarea>
   <div class="chips">${(SUGG[cur.cat]||[]).map(s=>`<button class="chip" data-nom="${esc(s)}">${esc(s)}</button>`).join("")}</div>`;
  ok=!!cur.nom.trim();
 } else if(step===4){
  body=`<h2>État</h2><div class="chips gros">${S_ETATS.map(e=>`<button class="chip ${cur.etat===e?"sel":""}" data-etats="${e}">${e}</button>`).join("")}</div>
   <h2 style="margin-top:22px">D'où vient-il ?</h2><div class="chips gros">${S_PROV.map(([t,v])=>`<button class="chip ${cur.prov===v?"sel":""}" data-provs="${v}">${t}</button>`).join("")}</div>`;
  ok=!!cur.etat&&!!cur.prov;
 } else {
  if(!cur.code||!cur.code.startsWith(cur.cat)||!/^\d+$/.test(cur.code.slice(cur.cat.length)))cur.code=nextCode(cur.cat);
  const ph=cur.slots.filter(Boolean),prov=(S_PROV.find(x=>x[1]===cur.prov)||[cur.prov])[0];
  body=`<h2>Tout est juste ?</h2><p class="hint">Touchez « Retour » pour corriger.</p>
   <div class="photos">${ph.map(p=>`<div class="ph"><img src="${p}" alt=""></div>`).join("")}</div>
   <div class="card recap"><dl><dt>Nom</dt><dd>${esc(cur.nom)}</dd><dt>Catégorie</dt><dd>${esc(label(cur.cat))}</dd>
   ${dimTxt(cur)?`<dt>Mesures</dt><dd>${dimTxt(cur)}</dd>`:""}<dt>Quantité</dt><dd>${esc(cur.qte)} ${esc(cur.unite+((+cur.qte>1&&/^(pièce|lot)$/.test(cur.unite))?"s":""))}</dd>
   <dt>État</dt><dd>${esc(cur.etat)}</dd><dt>Provenance</dt><dd>${esc(prov)}</dd></dl></div>
   <p class="hint" style="margin-top:12px">Écrivez <span class="code">${esc(cur.code)}</span> sur le matériau (craie, scotch ou étiquette).</p>
   <label class="f" for="note">Commentaire (facultatif)</label><textarea class="t" id="note" rows="3" style="resize:vertical" placeholder="marque, défaut, remarque…">${esc(cur.note)}</textarea>`;
 }
 a.innerHTML=head+body;
 bar(barre??((step>0?`<button class="big ghost back" id="prev">Retour</button>`:"")+`<button class="big vif" id="next" ${ok?"":"disabled"}>${step===last?"Enregistrer":"Suivant"}</button>`));
 $("#cancel").onclick=()=>{screen="home";render()};
 if($("#prev"))$("#prev").onclick=()=>{step--;render()};
 if($("#reprendre")){$("#reprendre").onclick=()=>{slotCible=cur.revoir;$("#cam").click()};$("#valide").onclick=()=>{cur.revoir=null;render()}}
 if($("#next"))$("#next").onclick=async()=>{trierDims(cur);if(step<last){step++;render()}else{cur.qte=Math.max(1,parseInt(cur.qte)||1);
  cur.photos=cur.slots.filter(Boolean);const f={...cur};delete f.slots;delete f.qual;delete f.revoir;delete f.reco;await dbPut(f);await load();toast("Matériau enregistré : "+cur.code);screen="home";render()}};
 const bind=k=>{const el=$("#"+k);if(el)el.oninput=()=>{cur[k]=el.value;if(k==="nom")$("#next").disabled=!el.value.trim()}};
 ["nom","L","l","h","qte","note"].forEach(bind);
 a.querySelectorAll("[data-shot]").forEach(b=>b.onclick=()=>{slotCible=+b.dataset.shot;$("#cam").click()});
 a.querySelectorAll("[data-voir]").forEach(b=>b.onclick=()=>{cur.revoir=+b.dataset.voir;render()});
 a.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{cur.unite=b.dataset.unit;render()});
 a.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{if(cur.cat!==b.dataset.cat){cur.cat=b.dataset.cat;cur.nom="";cur.code=""}step++;render()});
 a.querySelectorAll("[data-nom]").forEach(b=>b.onclick=()=>{trierDims(cur);cur.nom=nomParlant(b.dataset.nom);render()});
 a.querySelectorAll("[data-etats]").forEach(b=>b.onclick=()=>{cur.etat=b.dataset.etats;render()});
 a.querySelectorAll("[data-provs]").forEach(b=>b.onclick=()=>{cur.prov=b.dataset.provs;render()});
 if($("#plus")){$("#plus").onclick=()=>{cur.qte=(+cur.qte||0)+1;render()};$("#minus").onclick=()=>{cur.qte=Math.max(1,(+cur.qte||1)-1);render()}}
}

// Poids : pesé si possible, sinon estimé d'après la matière et les mesures (poids.js, même calcul que la caisse).
const poidsEstime=()=>Poids.estimer({nom:cur.nom,titre:cur.titreBase,cat:cur.cat,matiere:cur.matiere,unite:cur.unite,L:cur.L,l:cur.l,h:cur.h});
const parUnite=()=>cur.unite==="pièce"?"par pièce":"par "+cur.unite;
function poidsInfo(e){return e?`Estimé d'après ${e.base} : environ ${String(e.kg).replace(".",",")} kg.`:"Pesez si possible, ou laissez vide."}
function poidsHtml(){const e=poidsEstime();if(cur.poidsEst&&e)cur.poids=String(e.kg).replace(".",",");
 return `<label class="f" for="poids">Poids en kg ${parUnite()} (facultatif)</label>
 <input class="t" id="poids" inputmode="decimal" value="${esc(cur.poids||"")}" placeholder="${e?String(e.kg).replace(".",","):""}">
 <p class="hint" id="poidsInfo" style="margin:6px 0 0">${cur.poids&&!cur.poidsEst?"Poids pesé.":poidsInfo(e)}</p>
 <div class="chips" style="margin-top:0"><button class="chip" id="poidsEst" ${e?"":"hidden"}>Prendre l'estimation</button></div>`}
function majPoids(){const e=poidsEstime(),i=$("#poids");if(!i)return;i.placeholder=e?String(e.kg).replace(".",","):"";$("#poidsEst").hidden=!e;
 if(cur.poidsEst&&e){cur.poids=String(e.kg).replace(".",",");i.value=cur.poids}if(!cur.poids||cur.poidsEst)$("#poidsInfo").textContent=poidsInfo(e)}
function emplHtml(){const e=emplParts(cur.empl),conseil=ZONE_CAT[cur.cat];
 const c=(z,t)=>`<button class="chip zone ${e.z===z?"sel":""}" data-ez="${z}" style="--zc:${ZONE_COUL[z]}">${t}</button>`;
 let h=`<label class="f">Où est-il rangé ? <small class="ia">${esc(cur.empl||"pas encore choisi")}</small></label>
  <div class="chips">${c("R","Pas encore rangé")}${Object.keys(ZONES).map(z=>c(z,z)).join("")}</div>
  ${conseil?`<p class="hint">Zone conseillée pour cette catégorie : <b>${conseil}</b> (${esc(ZONES[conseil][0])}).</p>`:""}`;
 if(ZONES[e.z]){h+=`<label class="f">Numéro (travée, peigne ou gondole)</label><div class="chips">${Array.from({length:ZONES[e.z][1]},(_,i)=>`<button class="chip ${e.t==String(i+1)?"sel":""}" data-et="${i+1}">${e.z}${i+1}</button>`).join("")}</div>`;
  if(e.t&&!"DE".includes(e.z))h+=`<label class="f">Niveau (0 = au sol)</label><div class="chips">${[0,1,2,3,4,5].map(n=>`<button class="chip ${e.n===String(n)?"sel":""}" data-en="${n}">${n}</button>`).join("")}</div>`}
 return h}
function emplClic(a){a.querySelectorAll("[data-ez]").forEach(b=>b.onclick=()=>{const z=b.dataset.ez;cur.empl=z===emplParts(cur.empl).z&&z!=="R"?"":z;render()});
 a.querySelectorAll("[data-et]").forEach(b=>b.onclick=()=>{const e=emplParts(cur.empl);cur.empl=e.z+b.dataset.et+("DE".includes(e.z)?"-0":"");render()});
 a.querySelectorAll("[data-en]").forEach(b=>b.onclick=()=>{const e=emplParts(cur.empl);cur.empl=e.z+e.t+"-"+b.dataset.en;render()})}

// Photos réduites à 1600 px pour le site et pour garder le téléphone léger.
let slotCible=0;
const chargerImg=src=>new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=src});
$("#cam").onchange=async e=>{
 const file=e.target.files[0];e.target.value="";if(!file)return;
 const url=URL.createObjectURL(file),img=await chargerImg(url);
 const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");
 c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
 const f=cur,i=slotCible,data=c.toDataURL("image/jpeg",.82);
 if(i>=f.slots.length)f.slots.push(data);else f.slots[i]=data;
 if(i<3)f.qual[i]=qualite(c);
 if(i<2){f.reco=null;analyser(f)}
 if(screen==="wizs"&&i<3)f.revoir=i;
 render()};
(async()=>{
 try{await openDb();await load();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}
 catch(e){$("#app").innerHTML='<h1>Problème de stockage</h1><p class="hint">Le téléphone refuse d\'enregistrer les données. Ouvrez l\'app dans Chrome, pas en navigation privée.</p>';return}
 render();
 if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js");
})();
