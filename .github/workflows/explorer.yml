name: Explorer le catalogue public
on:
  push:
    branches: [site]
    paths: [outils/explorer.mjs, .github/workflows/explorer.yml]
permissions:
  contents: write
jobs:
  lire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node outils/explorer.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site && git commit -m "Catalogue public : page et requêtes" && git push
