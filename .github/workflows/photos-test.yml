name: Photos de test pour la reconnaissance
on:
  push:
    branches: [modeles]
    paths: [.github/workflows/photos-test.yml]
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger des photos Wikimedia Commons par catégorie
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, time
          Q = {
            "SA": ["washbasin bathroom", "toilet bowl ceramic", "kitchen sink stainless", "bathtub white"],
            "PA": ["shower enclosure glass"],
            "CH": ["window frame PVC", "wooden window frame"],
            "PO": ["interior wooden door", "front door"],
            "CAR": ["ceramic floor tiles stack", "wall tiles"],
            "GRO": ["pile of bricks", "concrete blocks"],
            "RA": ["radiator heating", "cast iron radiator"],
            "ELEC": ["electrical socket outlet", "circuit breaker panel"],
            "LUM": ["ceiling lamp", "wall light fixture"],
            "BOI": ["stack of wooden planks", "lumber timber"],
            "PAR": ["parquet flooring", "wood cladding"],
            "TOI": ["roof tiles stack", "slate roof tiles"],
            "ISO": ["glass wool insulation", "polystyrene insulation board"],
            "Q": ["door handle", "door hinges"],
            "OUT": ["hand saw", "power drill", "ladder"],
            "ELECTRO": ["refrigerator", "kitchen oven"],
            "DIV": ["wooden chair", "pallet"],
          }
          UA = {"User-Agent": "encodage-comptoir-test/1.0 (github.com/encodage-comptoir)"}
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30).read()
          meta = []
          for cat, qs in Q.items():
              os.makedirs(f"tests/photos/{cat}", exist_ok=True)
              for q in qs:
                  api = "https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode({
                      "action": "query", "format": "json", "generator": "search", "gsrsearch": f"filetype:bitmap {q}",
                      "gsrnamespace": 6, "gsrlimit": 4, "prop": "imageinfo", "iiprop": "url", "iiurlwidth": 480})
                  try:
                      pages = json.loads(get(api)).get("query", {}).get("pages", {})
                  except Exception as e:
                      print("ERR", q, e); continue
                  for i, p in enumerate(sorted(pages.values(), key=lambda p: p.get("index", 0))[:4]):
                      ii = p["imageinfo"][0]; u = ii.get("thumburl") or ii["url"]
                      name = f"tests/photos/{cat}/{q.replace(' ', '_')}-{i}.jpg"
                      try:
                          open(name, "wb").write(get(u)); meta.append({"cat": cat, "q": q, "file": name, "title": p["title"]})
                      except Exception as e:
                          print("ERR", u, e)
                      time.sleep(0.3)
          json.dump(meta, open("tests/photos/index.json", "w"), indent=1)
          print(len(meta), "photos")
          PY
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tests && git commit -m "Photos de test (Wikimedia Commons)" && git push
